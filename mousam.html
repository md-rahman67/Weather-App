
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WeatherLy</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="mousam.css">
</head>

<body>

    <div class="container min-vh-100 d-flex justify-content-center align-items-center py-4">

        <div class="weather-card p-4 p-md-5 text-center rounded-5 shadow-lg w-100">

            <!-- Search -->
            <div class="search-btn input-group mb-4 mx-auto">
                <input
                    type="text"
                    placeholder="Search city..."
                    id="inpt"
                    class="form-control border-0 shadow-none"
                >

                <button class="btn btn-warning rounded-circle" type="button">
                    <i class="fa-solid fa-magnifying-glass" id="srhIcon"></i>
                </button>
            </div>

            <!-- Weather Information -->
            <div class="middle">

                <img src="icon.png" alt="Weather icon" id="sunImg" class="img-fluid">

                <h1 class="display-1 fw-semibold"></h1>

                <p class="name fs-5 fw-medium"></p>

            </div>

            <!-- Weather Details -->
            <div class="end row g-3 mt-4">

                <div class="one col-6">
                    <div class="detail-card rounded-4 p-3 h-100">
                        <i class="fa-solid fa-wind text-warning fs-4 mb-2"></i>
                        <p class="ws fw-semibold mb-0"></p>
                        <p class="wsTag small mb-0"></p>
                    </div>
                </div>

                <div class="two col-6">
                    <div class="detail-card rounded-4 p-3 h-100">
                        <i class="fa-solid fa-droplet text-warning fs-4 mb-2"></i>
                        <p class="h-code fw-semibold mb-0"></p>
                        <p class="h-tag small mb-0"></p>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="mousam.js"></script>

</body>
</html>
